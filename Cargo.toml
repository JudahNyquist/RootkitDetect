[package]
name = "krds"
version = "0.1.0"
edition = "2021"
description = "simple linux rootkit checks"
authors = ["me"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
